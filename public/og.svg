<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#F4EFE6"/>

  <!-- the crease motif, carried over from the site -->
  <g stroke="#16130F" stroke-opacity="0.07" stroke-width="2">
    <line x1="-200" y1="120" x2="1500" y2="330"/>
    <line x1="-200" y1="300" x2="1500" y2="510"/>
    <line x1="-200" y1="480" x2="1500" y2="690"/>
  </g>

  <!-- vermilion crane mark -->
  <g transform="translate(72 66)">
    <rect x="4" y="4" width="20" height="20" transform="rotate(45 14 14)" fill="#E5391F"/>
    <text x="46" y="24" font-family="Helvetica, Arial, sans-serif" font-size="22"
          letter-spacing="8" fill="#16130F" fill-opacity="0.55">LAGOS · EST. 2019</text>
  </g>

  <text x="72" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="116"
        letter-spacing="-5" fill="#16130F">Cra7ty Hub</text>
  <text x="72" y="392" font-family="Helvetica, Arial, sans-serif" font-size="34"
        fill="#16130F" fill-opacity="0.7">Handfolded origami and paper goods.</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="24" letter-spacing="4" fill="#16130F" fill-opacity="0.55">
    <line x1="72" y1="500" x2="1128" y2="500" stroke="#16130F" stroke-opacity="0.12" stroke-width="2"/>
    <text x="72" y="552">CRANES FROM ₦1,500</text>
    <text x="470" y="552">DELIVERY ACROSS NIGERIA</text>
    <text x="880" y="552">NO PAYMENT GATEWAY</text>
  </g>
</svg>